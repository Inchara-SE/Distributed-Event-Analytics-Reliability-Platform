version: "3.9"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    container_name: pulsestream-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pulsestream-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=pulsestream
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: pulsestream-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pulsestream_metadata
      - POSTGRES_USER=pulsestream
      - POSTGRES_PASSWORD=pulsestream_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsestream -d pulsestream_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: pulsestream-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PULSESTREAM_ENV=development
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CLICKHOUSE_HOST=clickhouse
      - POSTGRES_HOST=postgres
      - API_PORT=8000
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  event-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: pulsestream-event-consumer
    command: python -m app.consumers.event_processor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  dlq-archiver:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: pulsestream-dlq-archiver
    command: python -m app.consumers.dlq_archiver
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  analytics-runner:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: pulsestream-analytics-runner
    command: python -m app.analytics.runner
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CADENCE_SECONDS=60
    depends_on:
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pulsestream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pulsestream-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redpanda_data:
  clickhouse_data:
  postgres_data:
  prometheus_data:
  grafana_data:
