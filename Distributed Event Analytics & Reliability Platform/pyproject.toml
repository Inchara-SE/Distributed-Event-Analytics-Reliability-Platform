[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsestream-event-analytics"
version = "0.1.0"
description = "PulseStream — Distributed Event Analytics & Reliability Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PulseStream Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "confluent-kafka>=2.5.0",
    "clickhouse-connect>=0.7.16",
    "psycopg[binary]>=3.2.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "dbt-core>=1.8.0",
    "dbt-clickhouse>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast in-memory unit tests",
    "contract: schema and API contract validation tests",
    "integration: requires live or containerized services",
    "resilience: failure injection and recovery verification tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
